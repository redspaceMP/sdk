name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript SDK (lint, build, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Lint
        run: bun run lint

      # Build before typecheck/test: packages consume sibling packages'
      # `dist/` output through their published `exports` maps.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  docs:
    name: Docs site (Vocs) + repo tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Biome check
        run: bun run lint

      - name: Test tools
        run: bun test tools/

      - name: Build docs site (AI search index + Vocs)
        working-directory: site
        run: bun install && bun run build

      - name: Verify search index artifact
        working-directory: site
        run: test -f dist/public/search-index.json && test -s dist/public/search-index.json

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish packages
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in server-types rpc client-types di browser-types testing; do
            (cd packages/@redspacem/$pkg && bun publish --access public)
          done
