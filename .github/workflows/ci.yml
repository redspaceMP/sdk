name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    # The SDK repo mirror has no Cargo workspace; only run Rust jobs when it does.
    if: hashFiles('Cargo.toml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test

  ts:
    name: TypeScript (lint, build, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install

      - name: lint
        run: bun run lint

      # Build before typecheck/test: packages consume sibling packages'
      # `dist/` output through their published `exports` maps.
      - name: build
        run: bun run build

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun test

  docs:
    name: Docs site (Vocs) + repo tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Biome check
        run: bun run lint

      - name: Test tools
        run: bun test tools/

      - name: Build docs site (AI search index + Vocs)
        working-directory: site
        run: bun install && bun run build

      - name: Verify search index artifact
        working-directory: site
        run: test -f dist/public/search-index.json && test -s dist/public/search-index.json

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish packages
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in server-types rpc client-types di browser-types testing; do
            (cd packages/@redspacem/$pkg && bun publish --access public)
          done