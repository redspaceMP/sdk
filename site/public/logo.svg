<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>RedSpace</title>
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0e0e16" />
      <stop offset="100%" stop-color="#171d2c" />
    </linearGradient>
    <linearGradient id="rs-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3d8a" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3fd4ff" />
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#rs-bg)" />

  <!-- Neon border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="url(#rs-neon)" stroke-width="1.6" opacity="0.9" />

  <!-- Signal dot -->
  <circle cx="48" cy="16" r="6" fill="none" stroke="#ff3d8a" stroke-width="1" opacity="0.35" />
  <circle cx="48" cy="16" r="3" fill="#ff3d8a" />

  <!-- Letter R: glow pass -->
  <g stroke="url(#rs-neon)" stroke-linecap="round" stroke-linejoin="round" stroke-width="11" opacity="0.28" fill="none">
    <path d="M22 46 V20 C25.2 20 30.4 20.6 33.4 24.4 C36.2 27.9 35.9 32.8 32.6 35.2 L22 35.2 M26.6 35.2 L43 46" />
  </g>

  <!-- Letter R: core pass -->
  <g stroke="url(#rs-neon)" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" fill="none">
    <path d="M22 46 V20 C25.2 20 30.4 20.6 33.4 24.4 C36.2 27.9 35.9 32.8 32.6 35.2 L22 35.2 M26.6 35.2 L43 46" />
  </g>
</svg>